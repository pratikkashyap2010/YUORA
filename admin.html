<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUORA Admin</title>
<style>
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#FAF7F1;color:#302B27}
main{max-width:1100px;margin:0 auto;padding:16px}
h1,h2{font-family:Georgia,serif;font-weight:500}
section{background:#fff;border:1px solid #E9DED0;padding:16px;margin:16px 0;overflow-x:auto}
input,select,textarea,button{font:inherit;padding:8px;border:1px solid #cbbfae;background:#fff;color:inherit;border-radius:2px}
button{background:#302B27;color:#FAF7F1;cursor:pointer}button.s{background:#fff;color:#302B27}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:8px 0}.row label{display:flex;flex-direction:column;font-size:.85rem}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #E9DED0;padding:6px;text-align:left;vertical-align:top;font-size:.9rem}
.warn{background:#E9DED0;padding:8px 12px}.low{color:#9b2c1d;font-weight:600}
</style></head><body><main>
<h1>YUORA Admin</h1><div id="msg" role="status" class="warn" hidden></div>
<section id="login" hidden><h2>Sign in</h2><div class="row"><label>Admin password<input id="pw" type="password" autocomplete="current-password"></label><button id="go">Sign in</button></div></section>
<div id="app" hidden>
<section><h2>Overview</h2><div id="ov"></div></section>
<section><h2>Products</h2><div class="row">
<input type="hidden" id="id"><label>Name<input id="name"></label><label>Collection<input id="coll" value="Everyday"></label>
<label>Original price (₹)<input id="originalPrice" type="number" min="0" step="0.01" style="width:110px"></label><label>Discount (%)<input id="discountPercent" type="number" min="0" max="99" step="0.1" value="0" style="width:90px"></label><label>Selling price (₹)<input id="price" type="number" min="1" step="0.01" style="width:110px" readonly></label><label>Stock<input id="stock" type="number" min="0" style="width:80px"></label>
<label>SKU<input id="sku" style="width:110px"></label><label>Status<select id="status"><option>draft</option><option>published</option><option>archived</option></select></label>
<label>Colour (if no photo)<input id="col" value="#E9DED0" style="width:90px"></label><label><span>Placeholder?</span><input id="ph" type="checkbox"></label></div>
<div class="row"><label>Product photos (JPG/PNG/WEBP, up to 5, first is the main photo)<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></div><div class="row" id="thumbs"></div>
<div class="row"><label style="flex:1">Description<textarea id="desc" rows="2"></textarea></label><button id="savep">Save product</button><button class="s" id="newp">Clear form</button></div>
<p class="low" style="font-weight:400">Set an original price and discount percentage. Selling price is calculated automatically.</p><table id="pt"></table></section>
<section><h2>Orders</h2><table id="ot"></table></section>
<section><h2>Store settings</h2><div class="row"><label>Flat shipping charge (₹)<input id="shipping" type="number" min="0" max="100000" step="1"></label><button id="sshipping">Save shipping charge</button></div><p>Set ₹0 for free shipping. New orders will include this charge in the UPI QR/link total.</p><h3>Announcement bar</h3><div class="row"><input id="ann" style="flex:1"><button id="sann">Save announcement</button></div></section>
<section><h2>Audit history</h2><table id="at"></table></section>
<button class="s" id="out">Sign out</button></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=(t)=>{const m=$('#msg');m.textContent=t;m.hidden=!t};
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{code:r.status});return j}
let D,imgs=[];function thumbs(){$('#thumbs').innerHTML=imgs.map((f,i)=>`<div style="text-align:center"><img src="/uploads/${f}" alt="" style="width:90px;height:90px;object-fit:cover;display:block"><button class="s" data-ri="${i}">Remove</button>${i?`<button class="s" data-mi="${i}">Make main</button>`:'<small>Main</small>'}</div>`).join('')||'<small>No photos yet.</small>'}
function shrink(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);let finished=false;const done=(fn,v)=>{if(finished)return;finished=true;URL.revokeObjectURL(u);fn(v)};im.onload=()=>{try{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const ctx=c.getContext('2d');if(!ctx)throw new Error('Your browser does not support image processing');ctx.drawImage(im,0,0,c.width,c.height);c.toBlob(blob=>{if(!blob){readOriginal();return}const reader=new FileReader();reader.onload=()=>done(ok,reader.result);reader.onerror=()=>done(no,new Error('Could not prepare the image for upload'));reader.readAsDataURL(blob)},'image/jpeg',.82)}catch(err){readOriginal()}};function readOriginal(){const reader=new FileReader();reader.onload=()=>done(ok,reader.result);reader.onerror=()=>done(no,new Error('Could not read the selected file. Try opening it and saving it again as JPG.'));reader.readAsDataURL(file)}im.onerror=readOriginal;im.src=u})}
const ST=['pending_payment','paid','processing','packed','shipped','out_for_delivery','delivered','cancelled','refund_pending','refunded'];
async function load(){try{D=await api('/api/admin/data');$('#login').hidden=true;$('#app').hidden=false;draw()}catch(e){$('#app').hidden=true;$('#login').hidden=false;if(e.code!==401)say(e.message)}}
function draw(){
const paid=D.orders.filter(o=>!['pending_payment','cancelled'].includes(o.status));
const sales=paid.reduce((a,o)=>a+o.total,0),cnt={};D.orders.forEach(o=>cnt[o.status]=(cnt[o.status]||0)+1);
const top={};paid.forEach(o=>o.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.n));
$('#ov').innerHTML=`<p>Payments: <b>${D.status.razorpay?'Razorpay keys set':'NOT set up (checkout disabled)'}</b>. Webhook secret: <b>${D.status.webhookSecret?'set':'missing'}</b>. Flat shipping: ₹${D.status.shipping}. Shipment creation and live tracking: manual entry only.</p><p>Verified sales: <b>₹${sales.toLocaleString('en-IN')}</b> from ${paid.length} orders. Status counts: ${Object.entries(cnt).map(([k,v])=>k+' '+v).join(', ')||'none yet'}.</p><p>Bestsellers: ${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>esc(k)+' ('+v+')').join(', ')||'no sales yet'}</p><p>Low stock (5 or fewer, published): ${D.products.filter(p=>p.status==='published'&&p.stock<=5).map(p=>`<span class="low">${esc(p.name)} (${p.stock})</span>`).join(', ')||'none'}</p>`;
$('#pt').innerHTML='<tr><th>Name</th><th>Collection</th><th>Original</th><th>Selling</th><th>Discount</th><th>Stock</th><th>Status</th><th></th></tr>'+D.products.map(p=>{const op=Number(p.originalPrice??p.original_price??p.price),sp=Number(p.price),dp=Number(p.discountPercent??p.discount_percent??(op>sp?Math.round((op-sp)/op*100):0));return `<tr><td>${p.imgs&&p.imgs[0]?`<img src="/uploads/${p.imgs[0]}" alt="" style="width:36px;height:36px;object-fit:cover;vertical-align:middle"> `:''}${esc(p.name)}</td><td>${esc(p.coll)}</td><td>₹${op}</td><td>₹${sp}</td><td>${op>sp?dp+'% off':'—'}</td><td>${p.stock}</td><td>${p.status}${p.ph?' (placeholder)':''}</td><td><button class="s" data-e="${p.id}">Edit</button></td></tr>`}).join('');
$('#ot').innerHTML=D.orders.length?'<tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status / tracking</th></tr>'+D.orders.slice().reverse().map(o=>`<tr data-o="${o.num}"><td>${o.num}<br>${new Date(o.created).toLocaleString()}</td><td>${esc(o.customer.name)}<br>${esc(o.customer.email)}<br>${esc(o.customer.phone)}<br>${esc(o.customer.address)}, ${esc(o.customer.city)}, ${esc(o.customer.state)} ${esc(o.customer.pin)}</td><td>${o.items.map(i=>esc(i.name)+' ×'+i.n).join('<br>')}${o.note?'<br><b>'+esc(o.note)+'</b>':''}</td><td>₹${o.total}<br>pay: ${o.pay.status}</td><td><select class="st">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><br><input class="ca" placeholder="Carrier" value="${esc(o.ship.carrier)}"><br><input class="tn" placeholder="Tracking no." value="${esc(o.ship.tracking)}"><br><input class="tu" placeholder="https:// tracking link" value="${esc(o.ship.url)}"><br><button data-so="${o.num}">Update</button></td></tr>`).join(''):'<tr><td>No orders yet.</td></tr>';
$('#ann').value=D.settings.announcement;$('#shipping').value=Number.isFinite(+D.settings.shipping)?D.settings.shipping:D.status.shipping;
$('#at').innerHTML=D.audit.map(a=>`<tr><td>${new Date(a.t).toLocaleString()}</td><td>${esc(a.a)}</td><td>${esc(a.d)}</td></tr>`).join('')||'<tr><td>Nothing yet.</td></tr>'}
const F=['id','name','coll','price','stock','sku','status','col','desc','originalPrice','discountPercent'];
function calcPrice(){const original=Number($('#originalPrice').value||0),pct=Number($('#discountPercent').value||0);const valid=original>0&&pct>=0&&pct<100;$('#price').value=valid?(Math.round(original*(1-pct/100))):'';}
$('#originalPrice').addEventListener('input',calcPrice);$('#discountPercent').addEventListener('input',calcPrice);
function clr(){imgs=[];thumbs();$('#files').value='';F.forEach(f=>$('#'+f).value=f==='coll'?'Everyday':f==='col'?'#E9DED0':f==='status'?'draft':f==='discountPercent'?'0':'');$('#ph').checked=false;calcPrice()}
document.addEventListener('click',async e=>{const t=e.target;try{
if(t.id==='go'){await api('/api/admin/login',{password:$('#pw').value});$('#pw').value='';say('');load()}
else if(t.dataset.e){const p=D.products.find(x=>x.id===t.dataset.e);F.forEach(f=>$('#'+f).value=p[f]??'');$('#originalPrice').value=p.originalPrice??p.original_price??p.price??'';$('#discountPercent').value=p.discountPercent??p.discount_percent??(Number(p.originalPrice??p.price)>Number(p.price)?Math.round((Number(p.originalPrice??p.price)-Number(p.price))/Number(p.originalPrice??p.price)*100):0);calcPrice();$('#ph').checked=!!p.ph;imgs=(p.imgs||[]).slice();thumbs();scrollTo(0,0)}
else if(t.dataset.ri){imgs.splice(+t.dataset.ri,1);thumbs()}
else if(t.dataset.mi){const [f]=imgs.splice(+t.dataset.mi,1);imgs.unshift(f);thumbs()}
else if(t.id==='newp')clr();
else if(t.id==='savep'){calcPrice();await api('/api/admin/product',{id:$('#id').value,name:$('#name').value,coll:$('#coll').value,price:Number($('#price').value),originalPrice:Number($('#originalPrice').value),discountPercent:Number($('#discountPercent').value),stock:parseInt($('#stock').value),sku:$('#sku').value,status:$('#status').value,col:$('#col').value,desc:$('#desc').value,ph:$('#ph').checked,imgs});say('Product saved.');clr();load()}
else if(t.dataset.so){const r=t.closest('tr');await api('/api/admin/order',{num:t.dataset.so,status:r.querySelector('.st').value,carrier:r.querySelector('.ca').value,tracking:r.querySelector('.tn').value,url:r.querySelector('.tu').value});say('Order updated.');load()}
else if(t.id==='sann'){await api('/api/admin/settings',{announcement:$('#ann').value});say('Announcement saved.');load()}
else if(t.id==='sshipping'){await api('/api/admin/settings',{shipping:Number($('#shipping').value)});say('Shipping charge saved.');load()}
else if(t.id==='out'){await api('/api/admin/logout',{});location.reload()}
}catch(err){say(err.message)}});
async function uploadSelectedFiles(input){
 const selected=Array.from(input.files||[]);
 if(!selected.length)return;
 try{
  for(const f of selected){
   if(imgs.length>=5){say('Maximum 5 photos per product.');break}
   if(!/^image\/(jpeg|png|webp)$/.test(f.type)){say('Please choose a JPG, PNG or WEBP image.');continue}
   say('Preparing '+f.name+'…');
   const data=await shrink(f);
   say('Uploading '+f.name+'…');
   const r=await api('/api/admin/upload',{data});
   imgs.push(r.file);thumbs();
   say('Uploaded '+f.name+'. Click Save product to keep it.');
  }
  if(selected.length && imgs.length)say('Photo upload complete. Click Save product to keep your changes.');
 }catch(err){const detail=err.message||'Unknown error';say('Image upload failed: '+detail+(err.code===413?' The image is too large. Choose a smaller JPG (under 3 MB).':err.code===401?' Please sign in to the admin panel again.':detail.includes('fetch')?' Check that the site is open at http://localhost:3000 and that node server.js is running.':''))}
 finally{input.value=''}
}
document.addEventListener('change',e=>{if(e.target.id==='files')uploadSelectedFiles(e.target)});
thumbs();load();
</script></body></html>
